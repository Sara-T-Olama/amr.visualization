<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solid of Revolution Visualizer</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f4f5f7;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h1 {
            font-size: 1.4rem;
            margin-top: 0;
            margin-bottom: 16px;
            color: #1e293b;
        }
        #canvas-container {
            width: 100%;
            height: 420px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
        }
        .stats {
            text-align: center;
            margin: 16px 0;
            font-size: 0.95rem;
            color: #475569;
            letter-spacing: 0.5px;
        }
        .stats span {
            font-weight: 700;
            color: #0f172a;
            font-size: 1.1rem;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input, select {
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            background: #f8fafc;
            color: #1e293b;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: #3b82f6;
            background: #fff;
        }
        button {
            grid-column: span 2;
            padding: 12px;
            background: #e2e8f0;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
            margin-top: 4px;
        }
        button:hover {
            background: #cbd5e1;
            color: #0f172a;
        }
    </style>
    <!-- Include Three.js, OrbitControls, and Math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
</head>
<body>
    <div class="container">
        <h1>Solid of Revolution</h1>
        <div id="canvas-container"></div>
        <div class="stats">VOLUME: <span id="volume-val">4.93</span></div>
        <div class="controls">
            <div class="control-group">
                <label>Function</label>
                <input type="text" id="fn-input" value="sin(x)">
            </div>
            <div class="control-group">
                <label>Lower Bound</label>
                <input type="number" id="lower-input" value="0" step="0.1">
            </div>
            <div class="control-group">
                <label>Upper Bound</label>
                <input type="number" id="upper-input" value="3.14" step="0.1">
            </div>
            <div class="control-group">
                <label>Rotation Axis</label>
                <select id="axis-input">
                    <option value="x">x</option>
                    <option value="y">y</option>
                </select>
            </div>
            <button id="rotate-btn">Rotate</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls, solidMesh;
        const container = document.getElementById('canvas-container');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xffffff);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(4, 3, 5);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(5, 10, 7);
            scene.add(directionalLight);

            // Grid & Axes
            const gridHelper = new THREE.GridHelper(10, 10, 0xcccccc, 0xe2e8f0);
            gridHelper.position.y = 0;
            scene.add(gridHelper);

            updateSolid();

            window.addEventListener('resize', onWindowResize);
            document.getElementById('rotate-btn').addEventListener('click', updateSolid);

            animate();
        }

        function updateSolid() {
            if (solidMesh) scene.remove(solidMesh);

            const fnStr = document.getElementById('fn-input').value;
            const lower = parseFloat(document.getElementById('lower-input').value);
            const upper = parseFloat(document.getElementById('upper-input').value);
            const axis = document.getElementById('axis-input').value;

            let compiledFn;
            try {
                const node = math.parse(fnStr);
                compiledFn = node.compile();
            } catch (e) {
                alert('Invalid function syntax.');
                return;
            }

            // Generate points for lathe geometry
            const points = [];
            const steps = 100;
            const dx = (upper - lower) / steps;
            let volume = 0;

            for (let i = 0; i <= steps; i++) {
                const x = lower + i * dx;
                let y = 0;
                try {
                    y = compiledFn.evaluate({ x: x });
                } catch (err) {
                    y = 0;
                }

                if (isNaN(y)) y = 0;

                if (axis === 'x') {
                    // Lathe revolves around Y in Three.js, so map x -> y (height) and y -> x (radius)
                    points.push(new THREE.Vector2(Math.abs(y), x));
                } else {
                    points.push(new THREE.Vector2(Math.abs(x), y));
                }

                if (i < steps) {
                    const nextX = lower + (i + 1) * dx;
                    let nextY = 0;
                    try {
                        nextY = compiledFn.evaluate({ x: nextX });
                    } catch (e) {
                        nextY = 0;
                    }
                    const avgR = (Math.abs(y) + Math.abs(nextY)) / 2;
                    volume += Math.PI * avgR * avgR * dx;
                }
            }

            document.getElementById('volume-val').innerText = volume.toFixed(2);

            const geometry = new THREE.LatheGeometry(points, 64);
            
            if (axis === 'x') {
                geometry.rotateZ(-Math.PI / 2);
            }

            const material = new THREE.MeshStandardMaterial({
                color: 0x38bdf8,
                side: THREE.DoubleSide,
                roughness: 0.3,
                metalness: 0.1,
                wireframe: false
            });

            solidMesh = new THREE.Mesh(geometry, material);
            scene.add(solidMesh);
        }

        function onWindowResize() {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html>
